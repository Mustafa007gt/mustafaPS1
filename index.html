<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصطفى جيمرز</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1f1f1f);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      background-color: #000000aa;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 999;
      box-shadow: 0 2px 10px #00f7ff80;
      backdrop-filter: blur(8px);
    }

    header h1 {
      margin: 0;
      font-size: 1.8em;
      color: #fff;
      text-shadow: 0 0 10px #00f7ff, 0 0 20px #00f7ff;
    }

    #searchInput {
      padding: 8px 12px; 
      font-size: 14px; 
      border-radius: 8px; 
      border: 2px solid #00f7ff30; 
      outline: none;
      background-color: #121212;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      transition: 0.3s;
    }

    #searchInput:focus {
      border-color: #00f7ff;
      box-shadow: 0 0 10px #00f7ff50;
    }

    .categories-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      flex-wrap: wrap;
    }

    .category-btn {
      background: #121212dd;
      color: #fff;
      border: 1px solid #00f7ff50;
      padding: 8px 20px;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #00f7ff20;
    }

    .category-btn.active, .category-btn:hover {
      background: linear-gradient(90deg, #00f7ff, #ff00f7);
      border-color: transparent;
      box-shadow: 0 0 15px #00f7ff80;
      transform: translateY(-2px);
    }

    .games-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .game-card {
      background: #121212dd;
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 0 20px #00f7ff30;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .game-card.hidden {
      display: none !important;
    }

    .game-card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 25px #00f7ff80;
    }

    .badge-new {
      position: absolute;
      top: 15px;
      right: -35px;
      background: linear-gradient(45deg, #ff0055, #ff00a0);
      color: white;
      padding: 4px 35px;
      font-size: 12px;
      font-weight: bold;
      transform: rotate(45deg);
      box-shadow: 0 0 10px #ff0055;
      text-shadow: 0 0 5px #fff;
      z-index: 2;
      letter-spacing: 1px;
    }

    .img-container {
      width: 100%;
      height: 140px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 1px solid #00f7ff20;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .game-card:hover .img-container {
      border-color: #00f7ff;
      box-shadow: 0 0 20px #00f7ffcc, 0 0 10px #ff00f750;
    }

    .game-card:hover img {
      transform: scale(1.06);
      filter: brightness(1.1);
    }

    .game-card h2 {
      color: #00f7ff;
      text-shadow: 0 0 5px #00f7ff;
      margin: 10px 0 5px 0;
      font-size: 1.4em;
    }

    .rating-stars {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 10px;
      flex-direction: row-reverse; 
    }

    .rating-stars span {
      font-size: 22px;
      color: #444;
      cursor: pointer;
      transition: color 0.2s, transform 0.1s;
    }

    .rating-stars span:hover,
    .rating-stars span:hover ~ span,
    .rating-stars span.active,
    .rating-stars span.active ~ span {
      color: #ffcc00 !important;
      text-shadow: 0 0 10px #ffcc00;
    }

    .rating-stars span:hover {
      transform: scale(1.2);
    }

    .card-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .download-link {
      position: relative;
      display: inline-block;
      padding: 12px 20px;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(270deg, #ff00f7, #00f7ff, #00ff88, #fffb00);
      background-size: 600% 600%;
      animation: rgb-glow 8s ease infinite;
      box-shadow: 0 0 15px #00f7ff88;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
      flex: 1;
    }

    .download-link.counting {
      background: #1a1a1a !important;
      border: 2px solid #ff00f7;
      animation: pulse-border 1.5s infinite;
      box-shadow: 0 0 15px #ff00f780;
      pointer-events: none;
      color: #ff00f7 !important;
      text-shadow: 0 0 8px #ff00f7;
    }

    @keyframes pulse-border {
      0% { border-color: #ff00f7; box-shadow: 0 0 10px #ff00f750; }
      50% { border-color: #00f7ff; box-shadow: 0 0 20px #00f7ff80; }
      100% { border-color: #ff00f7; box-shadow: 0 0 10px #ff00f750; }
    }

    .download-link:not(.counting):hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px #00f7ffcc;
    }

    @keyframes rgb-glow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #toast-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast-notification {
      background: rgba(18, 18, 18, 0.95);
      border: 2px solid #00f7ff;
      color: #fff;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 0 15px #00f7ff80, inset 0 0 10px #00f7ff20;
      text-shadow: 0 0 5px #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 250px;
      max-width: 350px;
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
      opacity: 0;
      backdrop-filter: blur(5px);
    }

    .toast-notification.show {
      transform: translateX(0);
      opacity: 1;
    }

    .toast-rating {
      border-color: #ffcc00;
      box-shadow: 0 0 15px #ffcc0080, inset 0 0 10px #ffcc0020;
    }

    footer {
      background-color: rgba(6, 5, 15, 0.9);
      margin-top: 60px;
      padding: 30px 20px;
      text-align: center;
      position: relative;
      border-top: 2px solid #ff00f7;
      box-shadow: 0 -5px 25px rgba(255, 0, 247, 0.15);
      backdrop-filter: blur(10px);
    }

    footer::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #ff00f7, #00f7ff, #ff00f7);
      background-size: 200% 100%;
      animation: rgb-glow 4s linear infinite;
    }

    .footer-content {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .footer-title {
      font-size: 1.5em;
      color: #fff;
      text-shadow: 0 0 10px #ff00f7, 0 0 20px #ff00f7;
      margin: 0;
    }

    .social-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 10px 0;
    }

    .social-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #121212;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .social-icon.telegram:hover {
      color: #0088cc;
      border-color: #0088cc;
      box-shadow: 0 0 15px rgba(0, 136, 204, 0.6);
      transform: translateY(-3px);
    }

    .footer-rights {
      color: #777;
      font-size: 13px;
      margin: 0;
      letter-spacing: 0.5px;
    }

    @media (max-width: 650px) {
      .games-container {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        padding: 12px;
      }

      .game-card {
        padding: 8px;
        border-radius: 15px;
      }

      .img-container {
        height: 140px;
      }

      .game-card h2 {
        font-size: 1.15em;
      }

      .download-link {
        padding: 10px 8px;
        font-size: 15px;
      }
    }

    @media (max-width: 390px) {
      .games-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

  <script>
    let currentCategory = 'all';

    function filterCategory(category) {
      currentCategory = category;
      const buttons = document.querySelectorAll('.category-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      if(window.event && window.event.target) {
        window.event.target.classList.add('active');
      }
      applyFilter();
    }

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', applyFilter);

    function applyFilter() {
      const query = searchInput.value.toLowerCase();
      const gameCards = document.querySelectorAll('.game-card');

      gameCards.forEach(card => {
        const title = card.querySelector('h2').textContent.toLowerCase();
        const description = card.querySelector('p').textContent.toLowerCase();
        const cardCategory = card.getAttribute('data-category');

        const matchesSearch = title.includes(query) || description.includes(query);
        const matchesCategory = currentCategory === 'all' || cardCategory === currentCategory;

        if (matchesSearch && matchesCategory) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    // نظام الإشعارات المنبثقة
    function showToast(message, isRating = false) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast-notification';
      if(isRating) {
        toast.classList.add('toast-rating');
      }
      toast.innerHTML = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('show');
      }, 50);

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          toast.remove();
        }, 400);
      }, 3000);
    }

    // العداد التنازلي للتحميل
    function startDownload(event, element) {
      event.preventDefault();
      const targetUrl = element.getAttribute('href');
      const gameTitle = element.parentElement.parentElement.querySelector('h2').textContent;
      let timeLeft = 3;

      element.classList.add('counting');
      element.textContent = `تجهيز.. (${timeLeft})`;
      showToast(`🛡️ جاري تجهيز رابط آمن للعبة: <br><span style="color:#00f7ff">${gameTitle}</span>`);

      const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          element.classList.remove('counting');
          element.textContent = 'تحميل';
          window.open(targetUrl, '_blank'); 
        } else {
          element.textContent = `تجهيز.. (${timeLeft})`;
        }
      }, 1000);
    }
  </script>
